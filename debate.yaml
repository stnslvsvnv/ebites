# Single debate config: settings, presets, model workers, and profiles.
# This file is the canonical config; skills/debate/debate.yaml mirrors it
# (verified by test_skill_debate_yaml_matches_root_config).
#
# Transport note: every worker runs through `opencode run` against a hosted
# gateway. 9router is no longer used — its `ocg/*` routes were a proxy whose
# upstream accounts went dry, while `opencode-go` serves the same models
# directly.

default:
  models: ["deepseek-pro", "gpt-5.6-sol", "off"]
  max_turns: null
  poll_interval_seconds: 1.0
  auto_save: false
  display_mode: "final"
  save_raw_output: true

presets:
  fast:
    models: ["deepseek-flash", "glm-flash", "off"]
    max_turns: 4

  strong:
    models: ["deepseek-pro", "gpt-5.6-sol", "off"]
    max_turns: 8

  claude:
    models: ["claude", "claude-fable", "off"]
    max_turns: 6

  council:
    models: ["deepseek-pro", "gpt-5.6-sol", "glm", "qwen", "off"]
    max_turns: 6

workers:
  # === Claude via CloseRouter ===
  # `claude` is served on the OpenAI-compatible wire. `claude-fable-5` is
  # advertised on the Anthropic messages wire only, so it needs the separate
  # `closerouter-anthropic` provider entry in ~/.config/opencode/opencode.json.

  claude:
    launch: 'opencode run --model closerouter/anthropic/claude-opus-5 --variant max --dangerously-skip-permissions "{{PROMPT}}"'
    prompt_file_launch: 'opencode run --pure --model closerouter/anthropic/claude-opus-5 --variant max --dangerously-skip-permissions "Execute attached prompt exactly. Reply only with your debate turn." --file {{PROMPT_FILE}}'
    description: "Claude Opus 5 via CloseRouter"

  claude-fable:
    launch: 'opencode run --model closerouter-anthropic/claude-fable-5 --variant max --dangerously-skip-permissions "{{PROMPT}}"'
    prompt_file_launch: 'opencode run --pure --model closerouter-anthropic/claude-fable-5 --variant max --dangerously-skip-permissions "Execute attached prompt exactly. Reply only with your debate turn." --file {{PROMPT_FILE}}'
    description: "Claude Fable 5 via CloseRouter (Anthropic wire)"

  # === OpenAI via CloseRouter ===

  gpt-5.6-sol:
    launch: 'opencode run --model closerouter/openai/gpt-5.6-sol --variant max --dangerously-skip-permissions "{{PROMPT}}"'
    prompt_file_launch: 'opencode run --pure --model closerouter/openai/gpt-5.6-sol --variant max --dangerously-skip-permissions "Execute attached prompt exactly. Reply only with your debate turn." --file {{PROMPT_FILE}}'
    description: "GPT-5.6 Sol via CloseRouter"

  gpt-5.6-luna:
    launch: 'opencode run --model closerouter/openai/gpt-5.6-luna --variant max --dangerously-skip-permissions "{{PROMPT}}"'
    prompt_file_launch: 'opencode run --pure --model closerouter/openai/gpt-5.6-luna --variant max --dangerously-skip-permissions "Execute attached prompt exactly. Reply only with your debate turn." --file {{PROMPT_FILE}}'
    description: "GPT-5.6 Luna via CloseRouter"

  # === DeepSeek via opencode-go ===

  deepseek-pro:
    launch: 'opencode run --model opencode-go/deepseek-v4-pro --variant max --dangerously-skip-permissions "{{PROMPT}}"'
    prompt_file_launch: 'opencode run --pure --model opencode-go/deepseek-v4-pro --variant max --dangerously-skip-permissions "Execute attached prompt exactly. Reply only with your debate turn." --file {{PROMPT_FILE}}'
    description: "DeepSeek V4 Pro via opencode-go"

  deepseek-flash:
    launch: 'opencode run --model opencode-go/deepseek-v4.1-flash --variant max --dangerously-skip-permissions "{{PROMPT}}"'
    prompt_file_launch: 'opencode run --pure --model opencode-go/deepseek-v4.1-flash --variant max --dangerously-skip-permissions "Execute attached prompt exactly. Reply only with your debate turn." --file {{PROMPT_FILE}}'
    description: "DeepSeek V4.1 Flash via opencode-go"

  # === GLM via opencode-go ===

  glm:
    launch: 'opencode run --model opencode-go/glm-5.3 --variant max --dangerously-skip-permissions "{{PROMPT}}"'
    prompt_file_launch: 'opencode run --pure --model opencode-go/glm-5.3 --variant max --dangerously-skip-permissions "Execute attached prompt exactly. Reply only with your debate turn." --file {{PROMPT_FILE}}'
    description: "GLM-5.3 via opencode-go"

  glm-flash:
    launch: 'opencode run --model opencode-go/glm-5.3-flash --variant max --dangerously-skip-permissions "{{PROMPT}}"'
    prompt_file_launch: 'opencode run --pure --model opencode-go/glm-5.3-flash --variant max --dangerously-skip-permissions "Execute attached prompt exactly. Reply only with your debate turn." --file {{PROMPT_FILE}}'
    description: "GLM-5.3 Flash via opencode-go"

  # === Kimi via opencode-go ===

  kimi-k3:
    launch: 'opencode run --model opencode-go/kimi-k3 --variant max --dangerously-skip-permissions "{{PROMPT}}"'
    prompt_file_launch: 'opencode run --pure --model opencode-go/kimi-k3 --variant max --dangerously-skip-permissions "Execute attached prompt exactly. Reply only with your debate turn." --file {{PROMPT_FILE}}'
    description: "Kimi K3 via opencode-go"

  # === Qwen via opencode-go ===

  qwen:
    launch: 'opencode run --model opencode-go/qwen3.8-max --variant max --dangerously-skip-permissions "{{PROMPT}}"'
    prompt_file_launch: 'opencode run --pure --model opencode-go/qwen3.8-max --variant max --dangerously-skip-permissions "Execute attached prompt exactly. Reply only with your debate turn." --file {{PROMPT_FILE}}'
    description: "Qwen3.8 Max via opencode-go"

  qwen-flash:
    launch: 'opencode run --model opencode-go/qwen3.8-flash --variant max --dangerously-skip-permissions "{{PROMPT}}"'
    prompt_file_launch: 'opencode run --pure --model opencode-go/qwen3.8-flash --variant max --dangerously-skip-permissions "Execute attached prompt exactly. Reply only with your debate turn." --file {{PROMPT_FILE}}'
    description: "Qwen3.8 Flash via opencode-go"

# Prompt substitution contract:
#   launch line: workers.<name>.launch with {{PROMPT}} replaced by prompt text
#   prompt-file line: workers.<name>.prompt_file_launch with
#       {{PROMPT_FILE}} replaced by the quoted prompt file path.
#   Headless debate MUST use prompt_file_launch: inlining multi-KB prompts via
#   {{PROMPT}} / argv wrapper causes empty capture ("no usable output").
#   Workers without prompt_file_launch fall back to a generated wrapper script.

# Готовые профили для быстрого переключения
profiles:
  current:
    investigation: "deepseek-pro"
    implementation: "glm"
    review: "deepseek-pro"

  claude:
    investigation: "claude"
    implementation: "claude-fable"
    review: "claude"

  fast:
    investigation: "deepseek-flash"
    implementation: "glm-flash"
    review: "deepseek-flash"
