# Single debate config: settings, presets, model workers, and profiles.
# This file is the canonical config; skills/debate/debate.yaml mirrors it
# (verified by test_skill_debate_yaml_matches_root_config).

default:
  models: ["deepseek-pro", "codex", "off"]
  max_turns: null
  poll_interval_seconds: 1.0
  auto_save: false
  display_mode: "final"
  save_raw_output: true

presets:
  fast:
    models: ["deepseek-flash", "glm", "off"]
    max_turns: 4

  strong:
    models: ["deepseek-pro", "codex", "off"]
    max_turns: 8

  claude:
    models: ["claude", "claude", "off"]
    max_turns: 6

  council:
    models: ["deepseek-pro", "codex", "glm", "qwen", "off"]
    max_turns: 6

workers:
  # === Claude standalone CLI (Opus) ===

  claude:
    launch: 'printf "%s" "{{PROMPT}}" | claude --bare --add-dir . --print'
    prompt_file_launch: 'claude --bare --add-dir . --print < {{PROMPT_FILE}}'
    description: "Opus latest"

  # === Claude Fable — canonical 5A debate Claude slot ===
  # Must run through the `claude` binary. Do not route Fable through OpenCode.
  claude-fable:
    launch: 'printf "%s" "{{PROMPT}}" | CLAUDE_CODE_MAX_RETRIES=0 claude -p --model fable --effort max --permission-mode bypassPermissions --setting-sources user --disable-slash-commands --no-session-persistence --tools ""'
    prompt_file_launch: 'CLAUDE_CODE_MAX_RETRIES=0 claude -p --model fable --effort max --permission-mode bypassPermissions --setting-sources user --disable-slash-commands --no-session-persistence --tools "" < {{PROMPT_FILE}}'
    description: "Claude Fable, max effort"
    timeout_seconds: 180

  # === Codex ===

  codex:
    launch: 'codex exec -c model="cx/gpt-5.6-sol" -c model_reasoning_effort="high" "{{PROMPT}}"'
    prompt_file_launch: 'codex exec -c model="cx/gpt-5.6-sol" -c model_reasoning_effort="high" < {{PROMPT_FILE}}'
    description: "Codex CLI (cx/gpt-5.6-sol, high reasoning)"

  # === DeepSeek ===

  deepseek-flash:
    launch: 'opencode run --model 9router/deepseek-v4-flash --variant max --dangerously-skip-permissions "{{PROMPT}}"'
    description: "DS4 Flash via 9router"

  deepseek-pro:
    launch: 'opencode run --model 9router/deepseek-v4-pro --variant max --dangerously-skip-permissions "{{PROMPT}}"'
    description: "DS4 Pro via 9router"

  # === GLM ===

  glm:
    launch: 'opencode run --model 9router/glm-5.2 --variant max --dangerously-skip-permissions "{{PROMPT}}"'
    description: "GLM 5.2"

  # === Grok ===

  grok:
    launch: 'opencode run --model 9router/grok-4.5 --variant max --dangerously-skip-permissions "{{PROMPT}}"'
    description: "Grok 4.5 via 9router"

  # === Kimi ===

  kimi-k3:
    launch: 'opencode run --model 9router/kimi-k3 --variant max --dangerously-skip-permissions "{{PROMPT}}"'
    description: "Kimi K3 via 9router"

  # === Qwen ===

  qwen:
    launch: 'opencode run --model 9router/qwen3.8-max --variant max --dangerously-skip-permissions "{{PROMPT}}"'
    description: "Qwen3.8 Max"

# Prompt substitution contract:
#   launch line: workers.<name>.launch with {{PROMPT}} replaced by prompt text
#   optional prompt-file line: workers.<name>.prompt_file_launch with
#       {{PROMPT_FILE}} replaced by the quoted prompt file path

# Готовые профили для быстрого переключения
profiles:
  current:
    investigation: "deepseek-pro"
    implementation: "glm"
    review: "deepseek-pro"

  claude:
    investigation: "claude"
    implementation: "claude"
    review: "claude"

  fast:
    investigation: "deepseek-flash"
    implementation: "glm"
    review: "deepseek-flash"